name: Read current Nexus file description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-description:
    name: Read approved Nexus metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: nexus-production

    steps:
      - name: Read current 2.0.0 file description
        shell: python
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          request = Request(
              "https://api.nexusmods.com/v1/games/baldursgate3/mods/23881/files.json",
              headers={
                  "apikey": os.environ["NEXUSMODS_API_KEY"],
                  "User-Agent": "BestofHands-release-maintenance",
              },
          )
          with urlopen(request, timeout=30) as response:
              payload = json.load(response)

          candidates = [
              entry for entry in payload.get("files", [])
              if str(entry.get("version")) == "2.0.0"
          ]
          if not candidates:
              raise RuntimeError("Nexus did not return a 2.0.0 file version.")
          selected = max(
              candidates,
              key=lambda entry: int(entry.get("uploaded_timestamp") or 0),
          )
          description = selected.get("description")
          if not isinstance(description, str) or not description:
              raise RuntimeError("The current 2.0.0 file description is empty or unavailable.")

          output = Path("nexus-description")
          output.mkdir()
          (output / "description.txt").write_text(description, encoding="utf-8")
          metadata = {
              "file_id": selected.get("file_id"),
              "name": selected.get("name"),
              "version": selected.get("version"),
              "uploaded_timestamp": selected.get("uploaded_timestamp"),
          }
          (output / "metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Upload description snapshot
        uses: actions/upload-artifact@v7
        with:
          name: nexus-description-v2.0.0-${{ github.sha }}
          path: nexus-description
          if-no-files-found: error
          retention-days: 1
